<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root { --bg:#FAFAF7; --ink:#111111; --sub:#595959; --line:#111111; --yolk:#F5B301; --yolk-deep:#D98200; --gray:#CFC8BB; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Pretendard', sans-serif; }
a { color: var(--ink); cursor: pointer; transition: color 200ms ease; }
a:hover { color: #7A5200; }
button { cursor: pointer; font-family: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.wrap { max-width: 1360px; margin: 0 auto; padding: 32px 40px 48px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 999px; background: #E9A400; margin-right: 8px; }
.label { display: flex; align-items: center; font-size: 14px; font-weight: 600; }
.num { font-variant-numeric: tabular-nums; letter-spacing: -0.04em; font-weight: 700; }
.muted { color: var(--sub); }
/* 첫 화면 */
.hero { display: flex; flex-wrap: wrap; gap: 48px; align-items: stretch; padding-bottom: 56px; }
.hero h1 { margin: 0; font-size: 72px; line-height: 1.1; font-weight: 900; letter-spacing: -0.03em; }
.posters { display: flex; gap: 16px; overflow-x: auto; }
.poster { flex: 0 0 320px; height: 400px; padding: 28px; display: flex; flex-direction: column; justify-content: space-between; }
.poster .big { font-size: 88px; line-height: .9; }
.poster .cap { display: flex; justify-content: space-between; font-size: 14px; border-top: 1.5px solid currentColor; padding-top: 12px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 24px; }
.cell { border-top: 1.5px solid var(--line); border-bottom: 1.5px solid var(--line); padding: 24px 4px; min-height: 260px;
        display: flex; flex-direction: column; justify-content: space-between; text-decoration: none; }
.cell h3 { margin: 12px 0 0; font-size: 28px; line-height: 1.35; font-weight: 700; }
/* 결과 화면 */
.headline { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 32px; }
.headline h1 { margin: 12px 0 0; font-size: 128px; line-height: .95; font-weight: 900; letter-spacing: -0.05em; }
.tabs { display: flex; gap: 32px; border-bottom: 1.5px solid var(--line); margin: 32px 0 0; }
.tabs button { background: none; border: none; padding: 12px 0; font-size: 16px; color: var(--sub); border-bottom: 3px solid transparent; margin-bottom: -1.5px; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--ink); }
.board { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-left: 1.5px solid var(--line); margin-top: 32px; }
.clickable { cursor: pointer; transition: background-color 200ms ease; }
.clickable:hover { background: #F2EFE8; }
.more { margin-top: auto; font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.dim { position: absolute; inset: 0; z-index: 999; background: rgba(250, 250, 247, 0.72); }
.dim[hidden] { display: none; }
.detail { position: absolute; left: 24px; right: 24px; z-index: 1000; background: #FFFBEF; border: 2px solid var(--ink);
          border-radius: 28px; box-shadow: 10px 10px 0 var(--yolk); padding: 40px 48px 48px; max-height: 860px; overflow: auto; }
.detail[hidden] { display: none; }
.detail-yolk { float: right; width: 72px; height: 72px; margin: 52px 0 0 24px; border-radius: 999px; background: #FFFFFF;
               border: 1.5px solid #E3D5B8; display: flex; align-items: center; justify-content: center; }
.detail-yolk::after { content: ""; width: 34px; height: 34px; border-radius: 999px; background: var(--yolk); }
.detail h2 { margin: 8px 0 0; font-size: 34px; font-weight: 900; letter-spacing: -0.02em; }
.detail h3 { display: flex; align-items: center; gap: 10px; margin: 36px 0 12px; font-size: 18px; font-weight: 700; }
.detail h3::before { content: ""; width: 14px; height: 14px; flex: none; border-radius: 999px; background: var(--yolk); border: 3px solid #FFFFFF; box-shadow: 0 0 0 1px #D9C79E; }
.detail p, .detail li { font-size: 16px; line-height: 1.7; margin: 0 0 8px; }
.detail ul { margin: 0; padding-left: 20px; }
.detail table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; background: #FFFFFF; border: 1px solid #EADFCB; border-radius: 16px; overflow: hidden; }
.detail th, .detail td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #F0E8D8; vertical-align: top; }
.detail tr:last-child td { border-bottom: none; }
.detail th { font-weight: 600; color: var(--sub); background: #FFF4D6; }
.detail td.n, .detail th.n { text-align: right; font-variant-numeric: tabular-nums; }
.detail .close { position: sticky; top: 0; float: right; width: 48px; height: 48px; border-radius: 999px; border: none; background: var(--ink); color: #FFFFFF; font-size: 18px; z-index: 1; }
.detail .close:hover { background: #333333; }
.detail .tip { background: #FFF1C2; border-radius: 16px; padding: 14px 18px; margin: 10px 0; }
.scroll-x { overflow-x: auto; }
.playbook { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 8px; }
.play-card { background: #FFFFFF; border: 1.5px solid var(--ink); border-radius: 20px; padding: 18px 20px; }
.play-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 18px; margin-bottom: 8px; }
.play-head span { font-size: 14px; color: var(--sub); }
.play-card ol { margin: 0; padding-left: 20px; } .play-card li { font-size: 15px; line-height: 1.6; }
table.plan { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 15px; border: 1.5px solid var(--ink); border-radius: 20px; overflow: hidden; background: #FFFFFF; }
table.plan th { text-align: left; padding: 12px 14px; background: #FFF4D6; font-size: 14px; font-weight: 700; border-bottom: 1.5px solid var(--ink); }
table.plan td { padding: 14px; border-bottom: 1px solid #EADFCB; vertical-align: top; line-height: 1.5; }
table.plan tr:last-child td { border-bottom: none; }
table.plan td.n, table.plan th.n { text-align: right; font-variant-numeric: tabular-nums; }
.box { border-right: 1.5px solid var(--line); border-bottom: 1.5px solid var(--line); padding: 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.span2 { grid-column: span 2; } .span3 { grid-column: span 3; }
#map { height: 520px; border: 1px solid #E3DED3; background: #F3EFE7; }
/* 실제 지도는 살리되 색을 빼서 노른자가 잘 보이게 */
#map .leaflet-tile-pane { filter: grayscale(1) contrast(0.85) brightness(1.08); }
.legend { display: flex; gap: 20px; font-size: 14px; flex-wrap: wrap; }
.legend span { display: flex; align-items: center; gap: 6px; }
.yolk { display: inline-block; border-radius: 999px; box-sizing: border-box; }
.timeline { display: flex; align-items: center; gap: 16px; }
.timeline input { flex: 1; accent-color: var(--ink); }
.play { width: 40px; height: 40px; border: 1.5px solid var(--ink); background: #FFFFFF; font-size: 14px; }
.cmp a { display: block; padding: 16px 24px; text-decoration: none; border-bottom: 1px solid #E0E0E0; }
.cmp a.on { background: var(--ink); color: #FFFFFF; }
.cmp a.on .muted { color: #CFCFCF; }
.bars { display: grid; grid-template-columns: 80px 1fr 48px; row-gap: 10px; column-gap: 12px; align-items: center; font-size: 14px; }
.bars i { display: block; height: 10px; background: var(--yolk); }
.foot { margin-top: 24px; font-size: 14px; color: var(--sub); }
.hero2 { display: flex; flex-wrap: wrap; gap: 48px; align-items: stretch; padding-top: 56px; }
.hero2 .left { flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; }
.hero2 h1 { margin: 14px 0 0; font-size: 72px; line-height: 1.1; font-weight: 900; letter-spacing: -0.03em; }
.hero2 .right { flex: 1 1 400px; min-width: 0; max-width: 460px; }
.car { position: relative; overflow: hidden; touch-action: pan-y; user-select: none; cursor: grab; }
.car.dragging { cursor: grabbing; }
.car-track { display: flex; gap: 16px; transition: transform 450ms cubic-bezier(.2,.7,.2,1); }
.car.dragging .car-track { transition: none; }
.car-slide { flex: 0 0 86%; height: 440px; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; justify-content: space-between; }
.car-slide .big { font-size: 112px; line-height: .9; font-variant-numeric: proportional-nums; }
.cm { font-size: 0.72em; margin: 0 -0.02em; }
.car-slide .cap { display: flex; justify-content: space-between; font-size: 14px; border-top: 1.5px solid currentColor; padding-top: 12px; }
.car-ctrl { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 16px; }
.car-dots { display: flex; gap: 8px; }
.car-dots button { width: 24px; height: 4px; padding: 0; border: none; background: #D9D9D9; transition: background-color 200ms ease, width 200ms ease; }
.car-dots button[aria-current="true"] { background: var(--ink); width: 40px; }
.car-btns { display: flex; gap: 8px; }
.car-btns button { width: 44px; height: 44px; border: 1.5px solid var(--ink); background: #FFFFFF; font-size: 18px; transition: background-color 200ms ease, color 200ms ease; }
.car-btns button:hover { background: var(--ink); color: #FFFFFF; }
@media (prefers-reduced-motion: reduce) { .car-track { transition: none; } }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 24px; }
.cell.small { min-height: 150px; padding: 18px 4px; }
.cell.small h3 { font-size: 24px; margin-top: 8px; }
.page-title { margin: 12px 0 16px; font-size: 64px; font-weight: 900; letter-spacing: -0.03em; }
.lead { font-size: 18px; line-height: 1.7; max-width: 860px; margin: 0 0 32px; }
.how-row { display: grid; grid-template-columns: 96px 1fr; gap: 24px; padding: 28px 0; border-top: 1.5px solid var(--line); }
.how-row h3 { margin: 0 0 8px; font-size: 24px; font-weight: 700; }
.how-row p { margin: 0; font-size: 16px; line-height: 1.7; max-width: 860px; }
.how-n { font-size: 40px; line-height: 1; }
@media (max-width: 900px) {
  .grid4, .grid3, .board { grid-template-columns: minmax(0, 1fr); }
  .span2, .span3 { grid-column: auto; }
  .hero h1 { font-size: 48px; } .headline h1 { font-size: 72px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
const DATA = __DATA__;
const fmt = n => (n === null || n === undefined) ? '-' : Number(n).toLocaleString('ko-KR');
const F = DATA.flags || {};
// 큰 숫자: 쉼표 양옆 간격을 조금 줄임
const bigNum = n => fmt(n).replace(/,/g, '<span class="cm">,</span>');
const be = w => w ? `손익분기 ${w}주 차` : '12주 안 손익분기 전';
const beR = w => F.breakeven ? be(w) : '월세를 넣으면 손익분기를 계산해요';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NAME = { '허브쿠폰': '입소문 대장 쿠폰' };
const nm = k => NAME[k] || k;
const CH = { '동네': '동네 이웃', '지나가다': '지나가다', '검색': '검색', '당근': '당근', '인스타': '인스타', '맘카페': '맘카페', '에타': '에타' };
const app = document.getElementById('app');
const MORE = '<span class="more">자세히 보기 →</span>';

function promoText(p) {
  if (!p || !p.split) return null;
  const parts = Object.entries(p.split).map(([c, b]) => `${nm(c)} ${Math.round(b / 10000)}만 원`);
  if (p.discount) parts.push('오픈 할인');
  return parts.join(' + ');
}

function curveSVG(weekly) {
  const W = 600, H = 200, max = Math.max(...weekly) || 1, n = weekly.length;
  const pts = weekly.map((v, i) => [20 + i * (W - 40) / (n - 1), H - 24 - v / max * (H - 48)]);
  const peak = weekly.indexOf(Math.max(...weekly));
  const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const lab = (i, t) => `<text x="${pts[i][0]}" y="${pts[i][1] - 10}" font-size="13" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}" fill="#111">${t}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="12주 손님 곡선, ${peak + 1}주 차가 가장 많음">
    <line x1="0" y1="${H - 16}" x2="${W}" y2="${H - 16}" stroke="#111" stroke-width="1.5"/>
    <path d="${path}" fill="none" stroke="#F5B301" stroke-width="5" stroke-linejoin="round"/>
    ${[0, peak, n - 1].map(i => `<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="5" fill="#111"/>`).join('')}
    ${lab(0, 'W1 · ' + fmt(weekly[0]))}${lab(peak, 'W' + (peak + 1) + ' · ' + fmt(weekly[peak]))}${peak !== n - 1 ? lab(n - 1, 'W' + n + ' · ' + fmt(weekly[n - 1])) : ''}
  </svg>`;
}

/* ---------- 첫 화면 ---------- */
function renderHome() {
  const d = DATA.dongs;
  const cells = d.map(x => `<div class="cell small">
      <span><span class="label"><span class="dot"></span>${esc(DATA.idea).slice(0, 18)}</span><h3>${esc(x.dong)}</h3></span>
      <span style="font-size:15px">월 ${fmt(x.monthly)}명 · ${be(x.breakeven)}</span></div>`).join('');
  app.innerHTML = `
    <section id="list">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:16px">
        <h2 style="margin:0;font-size:24px;font-weight:900">최근 예측<sup class="muted" style="font-size:14px;font-weight:400;margin-left:6px">${d.length}</sup></h2>
      </div>
      <div class="grid3">${cells}</div>
    </section>
    <p class="foot">가상 시민과 서울시 상권 데이터로 계산한 예측이며 실제 매출을 보장하지 않습니다.</p>`;
}

/* ---------- 첫 화면 위쪽: 제목 + 캐러셀 ---------- */
function renderHero() {
  const d = DATA.dongs;
  const styles = [
    { bg: '#F5B301', fg: '#111111', border: 'none' },
    { bg: '#111111', fg: '#FFFFFF', border: 'none' },
    { bg: '#FFFFFF', fg: '#111111', border: '1.5px solid #111111' },
  ];
  const slides = d.map((x, i) => {
    const st = styles[i % 3];
    return `<div class="car-slide" role="group" aria-roledescription="슬라이드" aria-label="${i + 1} / ${d.length}" style="background:${st.bg};color:${st.fg};border:${st.border}">
      <span style="font-size:18px;font-weight:700">${esc(x.dong)}</span>
      <div><div class="num big">${bigNum(x.monthly)}</div><div style="font-size:16px;margin-top:20px">3달째 한 달 손님</div></div>
      <div class="cap"><span>${be(x.breakeven)}</span><span class="num" style="letter-spacing:0">${String(i + 1).padStart(2, '0')} / ${String(d.length).padStart(2, '0')}</span></div></div>`;
  }).join('');
  app.innerHTML = `
    <section class="hero2">
      <div class="left">
        <div><h1>노른자<br>동네별 입소문·방문 예측</h1>
          <svg viewBox="0 0 780 170" width="100%" style="max-width:780px;display:block;margin-top:32px;overflow:visible" aria-hidden="true">
            <defs>
              <marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M0 0 L12 6 L0 12 Z" fill="#F5B301"></path>
              </marker>
            </defs>
            <polyline points="4,160 46,138 74,150 126,112 150,124 172,118 230,96 258,120 312,74 340,88 362,82 418,62 436,90 496,48 532,66 590,34 612,46 664,22 690,30 760,6"
              fill="none" stroke="#F5B301" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"></polyline>
          </svg></div>
        <div style="font-size:18px;line-height:1.6">서울 ${DATA.dong_total}개 행정동 · 가상 시민 ${fmt(DATA.people_total)}명<br>2025년 서울시 상권 데이터 기준</div>
      </div>
      <div class="right">
        <div class="car" id="car" role="region" aria-roledescription="캐러셀" aria-label="예시 결과" tabindex="0">
          <div class="car-track" id="track">${slides}</div>
        </div>
        <div class="car-ctrl">
          <div class="car-dots">${d.map((x, i) => `<button aria-label="${esc(x.dong)} 보기" data-i="${i}"></button>`).join('')}</div>
        </div>
      </div>
    </section>`;
  const track = document.getElementById('track'), car = document.getElementById('car');
  const dots = [...document.querySelectorAll('.car-dots button')];
  let i = 0, auto = null, startX = null, dx = 0;
  const step = () => { const sl = track.children[0]; return sl ? sl.getBoundingClientRect().width + 16 : car.clientWidth; };
  const place = (extra = 0) => { track.style.transform = `translateX(${-i * step() + extra}px)`; };
  const go = n => {
    i = Math.max(0, Math.min(d.length - 1, n));
    place();
    dots.forEach((b, k) => b.setAttribute('aria-current', k === i ? 'true' : 'false'));
  };
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const play = () => { if (!reduced && !auto && d.length > 1) auto = setInterval(() => go(i + 1 >= d.length ? 0 : i + 1), 4000); };
  const stop = () => { clearInterval(auto); auto = null; };
  dots.forEach(b => b.addEventListener('click', () => { stop(); go(Number(b.dataset.i)); }));
  car.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') { stop(); go(i - 1); } if (e.key === 'ArrowRight') { stop(); go(i + 1); } });
  // 마우스·손가락으로 끌면 카드가 따라오고, 놓으면 가까운 카드로 붙음
  car.addEventListener('pointerdown', e => { startX = e.clientX; dx = 0; stop(); car.classList.add('dragging'); car.setPointerCapture && car.setPointerCapture(e.pointerId); });
  car.addEventListener('pointermove', e => {
    if (startX === null) return;
    dx = e.clientX - startX;
    const edge = (i === 0 && dx > 0) || (i === d.length - 1 && dx < 0);
    place(edge ? dx / 3 : dx);
  });
  const end = () => {
    if (startX === null) return;
    car.classList.remove('dragging');
    const w = step();
    go(Math.abs(dx) > w * 0.2 ? i + (dx < 0 ? 1 : -1) : i);
    startX = null; dx = 0;
  };
  car.addEventListener('pointerup', end); car.addEventListener('pointercancel', end);
  car.addEventListener('mouseenter', stop); car.addEventListener('mouseleave', () => { end(); play(); });
  window.addEventListener('resize', () => place());
  go(0); play();
}

/* ---------- 계산 방법 ---------- */
function renderHow() {
  const step = (n, t, body) => `<div class="how-row"><span class="num how-n">${n}</span><div><h3>${t}</h3><p>${body}</p></div></div>`;
  app.innerHTML = `
    <span class="label"><span class="dot"></span>How it works</span>
    <h1 class="page-title">계산 방법</h1>
    <p class="lead">아직 손님이 없는 가게의 손님을 미리 보기 위해, 가상 시민들 사이에서 가게 소식이 퍼지고 손님이 찾아오는 과정을 그대로 흉내 냅니다.</p>
    ${step('01', '가상 시민 30,000명', `서울 ${DATA.dong_total}개 행정동에 실제 인구 비율대로 가상 시민을 배치했어요. 시민마다 나이와 직업으로 15개 집단에 속하고, 집단마다 이 가게에 대한 관심도, 추천 의향, 안 가는 이유, 쓰는 커뮤니티, 새 가게를 찾는 방법을 합성 설문으로 받았어요.`)}
    ${step('02', '소식이 퍼지는 길', '시민끼리 가까운 이웃, 같은 커뮤니티(맘카페, 당근, 인스타, 에타)로 연결돼 있어요. 소식은 매주 입소문, 검색, 가게 앞을 지나다 발견하는 세 가지 길로 퍼지고, 전할지 말지는 보내는 사람의 추천 의향과 받는 사람의 관심도로 정해져요.')}

}

/* ---------- 검증을 쉬운 말로 ---------- */
function verdict(r) {
  r = Number(r);
  if (r >= 0.5) return { short: '동네 순위를 잘 맞혀요', long: '이 서비스가 좋다고 본 동네는 실제로도 카페 매출이 높은 경우가 많아요.' };
  if (r >= 0.3) return { short: '동네 순위를 어느 정도 맞혀요', long: '이 서비스가 좋다고 본 동네는 실제로도 카페 매출이 높은 편이에요.' };
  if (r >= 0.1) return { short: '동네 순위를 대략적으로 맞혀요', long: '이 서비스가 좋다고 본 동네가 실제로도 카페 매출이 높은 경향은 있지만, 강하지는 않아요.' };
  if (r > -0.1) return { short: '아직 순위를 잘 못 맞혀요', long: '이 서비스의 동네 순위와 실제 카페 매출 순위 사이에 뚜렷한 관계가 없어요.' };
  return { short: '순위가 실제와 반대예요', long: '이 서비스가 좋다고 본 동네의 실제 카페 매출이 오히려 낮은 편이에요.' };
}
function gauge(r) {
  const x = 20 + (Number(r) + 1) / 2 * 560;
  return `<svg viewBox="0 0 600 86" width="100%" style="max-width:600px" role="img" aria-label="점수 ${Number(r).toFixed(2)}, -1부터 1 사이">
    <line x1="20" y1="40" x2="580" y2="40" stroke="#111" stroke-width="2"/>
    ${[[-1, '반대'], [0, '관계 없음'], [1, '완전히 같음']].map(([v, t]) => { const px = 20 + (v + 1) / 2 * 560;
      return `<line x1="${px}" y1="32" x2="${px}" y2="48" stroke="#111" stroke-width="2"/><text x="${px}" y="72" font-size="13" text-anchor="${v === -1 ? 'start' : v === 1 ? 'end' : 'middle'}" fill="#595959">${v} ${t}</text>`; }).join('')}
    <circle cx="${x}" cy="40" r="13" fill="#F5B301" stroke="#FFFFFF" stroke-width="4"/><circle cx="${x}" cy="40" r="13" fill="none" stroke="#D9C79E"/>
    <text x="${x}" y="18" font-size="14" font-weight="700" text-anchor="middle" fill="#111">${Number(r).toFixed(2)}</text>
  </svg>`;
}

/* ---------- 12주 실행 계획 ---------- */
const UNIT = { '당근': 300, '인스타': 18, '체험단': 100000, '맘카페': 200000, '허브쿠폰': 20000 };  // 원 (인스타는 노출 1회)
function topGroupsFor(cs, ch, n = 2, cnt = {}) {
  // 인원이 너무 적은 집단(20명 미만)은 비율이 튀어서 제외
  return Object.entries(cs).filter(([g0]) => !cnt[g0] || cnt[g0] >= 20).map(([g0, m]) => [g0, m[ch] || 0]).filter(([, v]) => v > 0)
    .sort((a, b) => b[1] - a[1]).slice(0, n).map(([g0]) => g(g0));
}
function planHTML(x) {
  const d = x.detail || {}, bp = d.budget_plan || {}, cs = d.channel_share || {}, ct = x.channels || {};
  const rp = d.repromo || {}, hubs = d.hubs || [], pres = d.prescriptions || [], cnt = d.group_count || {};
  const stall = rp.week || 7;
  const whenOf = t => t === '오픈전' ? [0, '오픈 1주 전'] : t === '정체기' ? [stall, `${stall}주 차`] : [1, '오픈 주'];
  const won = v => v >= 10000 ? `${fmt(Math.round(v / 10000))}만 원` : `${fmt(v)}원`;
  const rows = [];
  if (F.promo && bp.split) {
    for (const [ch, b] of Object.entries(bp.split)) {
      const [ord, when] = whenOf((bp.timing || {})[ch]);
      const qty = { '당근': `동네 광고, 가게 반경 1.5km · 클릭 약 ${fmt(Math.round(b / UNIT['당근']))}번`,
        '인스타': `지역 타깃 광고 · 노출 약 ${fmt(Math.round(b / UNIT['인스타']))}회`,
        '체험단': `동네 블로거 체험단 ${fmt(Math.max(1, Math.round(b / UNIT['체험단'])))}명 초대`,
        '맘카페': `지역 맘카페(회원 1만 명) 배너 ${Math.max(1, Math.round(b / UNIT['맘카페']))}달`,
        '허브쿠폰': `입소문 대장에게 첫 방문 쿠폰 ${fmt(Math.round(b / UNIT['허브쿠폰']))}장` }[ch] || ch;
      const who = ch === '허브쿠폰' ? (hubs[0] ? [g(hubs[0].group)] : []) : topGroupsFor(cs, ch, 2, cnt);
      rows.push([ord, when, `<b>${esc(nm(ch))}</b> ${qty}`, who.join(', ') || '동네 전체', won(b), `홍보 추천 배분 · ${esc((bp.timing || {})[ch] || '')}에 가장 효과적`]);
    }
    if (bp.open_discount) {
      const price = pres.find(p => p.reason_type === '가격');
      rows.push([1, '오픈 주', '<b>오픈 할인</b> 첫 2주 20%', price ? g(price.group) : '가격이 부담인 손님', `약 ${won(bp.discount_cost || 0)}`, '할인해준 금액만큼 비용']);
    }
  } else {
    rows.push([1, '오픈 주', '<b>당근</b> 동네생활에 가게 소개 글 올리기', topGroupsFor(cs, '당근', 2, cnt).join(', ') || '동네 이웃', '무료', `당근으로 알게 되는 비율 ${pct(ct['당근'] || 0)}`]);
  }
  if ((ct['검색'] || 0) >= 0.08) rows.push([1, '오픈 주', '<b>네이버 지도</b> 가게 등록, 첫 손님에게 사진 후기 부탁', '검색해서 찾는 손님', '무료', `검색으로 알게 되는 비율 ${pct(ct['검색'])} · 후기가 쌓일수록 늘어요`]);
  if ((ct['지나가다'] || 0) >= 0.08) rows.push([1, '오픈 주', '<b>가게 앞</b> 입간판·바깥 메뉴판으로 가격 보이게', '가게 앞을 지나는 사람', '-', `지나가다 들어오는 비율 ${pct(ct['지나가다'])}`]);
  if (hubs.length) {
    const comm = {};
    hubs.forEach(h => (h.community || []).forEach(c => comm[c] = (comm[c] || 0) + 1));
    const topC = Object.entries(comm).sort((a, b) => b[1] - a[1])[0];
    rows.push([2, '1~2주 차', `<b>입소문 대장</b>에게 시식·첫 방문 쿠폰${topC ? `, ${esc(topC[0])}에 후기 부탁` : ''}`, g(hubs[0].group), '-', ((d.hub_vs_broad || {}).reach_hub ? `입소문 대장 1명이 평균 ${d.hub_vs_broad.reach_hub}명에게 전해요` : `가장 많이 전한 사람은 ${fmt(hubs[0].reach)}명에게 소식을 퍼뜨렸어요`)]);
  }
  pres.slice(0, 2).forEach(p => rows.push([3, '2~4주 차', `<b>${esc(p.channel)}</b>로 ${esc(p.offer)}`, g(p.group), '-', `이 집단은 소식이 ${pct(p.awareness)}에게만 닿았어요 (전체 ${pct(p.overall_awareness)})`]));
  if (rp.week) rows.push([rp.week, `${rp.week}주 차`, '<b>다시 알리기</b> 재방문 쿠폰·기간 한정 메뉴', '이미 온 손님과 이웃', '-', `손님이 줄기 시작하는 때 · 12주 동안 +${fmt(rp.gain)}명`]);
  rows.sort((a, b) => a[0] - b[0]);
  const head = F.promo && bp.visitors_gain ? `<p style="margin:0;font-size:16px">이대로 하면 12주 동안 손님이 약 <b>${fmt(bp.visitors_gain)}명</b> 더 오고, ${bp.payback_week ? `<b>${bp.payback_week}주 차</b>에 광고비를 돌려받아요.` : '12주 안에는 광고비를 다 돌려받지 못해요.'}</p>`
    : '<p class="muted" style="margin:0;font-size:15px">홍보 예산을 넣으면 채널별 예산과 시기까지 채워져요.</p>';
  return head + `<div class="scroll-x"><table class="plan"><thead><tr><th>언제</th><th>무엇을</th><th>누구에게</th><th class="n">예산</th><th>왜</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td style="white-space:nowrap;font-weight:700">${r[1]}</td><td>${r[2]}</td><td>${esc(r[3])}</td><td class="n" style="white-space:nowrap">${r[4]}</td><td class="muted">${r[5]}</td></tr>`).join('')}</tbody></table></div>
    <p class="muted" style="margin:0;font-size:13px">광고 단가는 조사한 평균 단가 기준이에요 (당근 클릭당 300원, 인스타 노출 1,000회당 1.8만 원, 체험단 1명 10만 원, 맘카페 배너 월 20만 원).</p>`;
}

/* 막힌 집단이 없을 때: 집단별 인지율을 평균과 비교 (20명 미만 집단은 제외) */
function awarenessCheck(d) {
  const ga = d.group_awareness || {}, cnt = d.group_count || {};
  const rows = Object.entries(ga).filter(([g0]) => !cnt[g0] || cnt[g0] >= 20);
  if (!rows.length) return null;
  const tot = rows.reduce((a, [g0]) => a + (cnt[g0] || 1), 0);
  const avg = rows.reduce((a, [g0, v]) => a + v * (cnt[g0] || 1), 0) / tot;
  rows.sort((a, b) => a[1] - b[1]);
  return { avg, rows, low: rows[0] };
}

/* 채널별 따라 하기 (일반적으로 많이 쓰는 방법) */
const PLAYBOOK = {

  '검색': ['네이버 지도에 메뉴·가격·영업시간·사진 10장 이상 등록', '첫 2주 영수증 후기 이벤트로 후기 쌓기', '가게 소개에 "동네 이름 + 메뉴" 검색어 넣기'],

  '인스타': ['오픈 전부터 공사·메뉴 준비 과정 올리기', '#동네이름카페 같은 지역 해시태그 쓰기', '사진 찍고 싶은 자리 하나 만들기'],
  '맘카페': ['카페 규칙 확인 후 제휴 업체 등록이나 배너', '유아 의자·넓은 통로 같은 아이 동반 편의 알리기', '평일 오전 할인으로 등원 후 시간 공략'],

/* ---------- 자세히 보기 ---------- */
const g = s => esc(String(s || '').replace('_', ' '));
const pct = v => (v === null || v === undefined) ? '-' : Math.round(v * 100) + '%';
const table = (head, rows, numCols = []) => `<div class="scroll-x"><table><thead><tr>${head.map((h, i) => `<th class="${numCols.includes(i) ? 'n' : ''}">${h}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${numCols.includes(i) ? 'n' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

function detailCurve(x, d) {
  const w = d.weekly || [], peak = w.indexOf(Math.max(...w)) + 1, a = d.assumptions || {};
  let out = `<span class="label"><span class="dot"></span>12 weeks</span><h2 id="detail-title">${esc(x.dong)} 12주 손님 흐름</h2>
    <p style="margin-top:12px">손님은 ${peak}주 차에 주 ${fmt(w[peak - 1])}명으로 가장 많고, 12주 차에는 주 ${fmt(w[w.length - 1])}명이에요.</p>
    <h3>주별 손님</h3>${table(['주차', ...w.map((_, i) => (i + 1) + '주')], [['손님', ...w.map(fmt)]], w.map((_, i) => i + 1))}`;
  if (F.breakeven && a.rent && a.avg_price) {
    const fixedWeek = (a.rent + (a.other_fixed_monthly || 0)) / 4.345;
    const need = Math.ceil(fixedWeek / (a.avg_price * (a.gross_margin || 0.6)));
    out += `<h3>손익분기</h3><p>월세 ${fmt(Math.round(a.rent / 10000))}만 원과 기타 고정비 ${fmt(Math.round((a.other_fixed_monthly || 0) / 10000))}만 원을 주 단위로 나누면 약 ${fmt(Math.round(fixedWeek / 10000))}만 원이에요. 객단가 ${fmt(a.avg_price)}원, 마진율 ${Math.round((a.gross_margin || 0.6) * 100)}%면 <b>주 ${fmt(need)}명</b>이 넘어야 고정비를 넘어요.</p>
      <p>${x.breakeven ? `이 동네는 ${x.breakeven}주 차에 처음 넘어요.` : '12주 안에는 이 선을 넘지 못해요.'}</p>`;
  }
  const rp = d.repromo;
  if (rp && rp.week) out += `<h3>추가 홍보 시점</h3><p>손님이 줄기 시작하는 <b>${rp.week}주 차</b>에 소식을 다시 알리면 12주 동안 약 <b>${fmt(rp.gain)}명</b>이 더 와요.</p>
    ${table(['', ...rp.with.map((_, i) => (i + 1) + '주')], [['추가 홍보', ...rp.with.map(fmt)], ['안 할 때', ...rp.without.map(fmt)]], rp.with.map((_, i) => i + 1))}`;
  out += '<h3>이렇게 해보세요</h3>';
  if (F.breakeven && !x.breakeven) out += '<p class="tip">12주 안에 손익분기를 넘지 못해요. 월세가 더 낮은 자리나 객단가를 올리는 방법을 같이 검토해 보세요.</p>';
  if (peak <= 4) out += '<p class="tip">소문이 빨리 퍼지고 빨리 식는 동네예요. 오픈 직후 온 손님에게 재방문 쿠폰을 주는 게 중요해요.</p>';
  else if (peak >= 8) out += '<p class="tip">천천히 알려지는 동네예요. 초반 몇 주는 손님이 적어도 버틸 수 있게 자금 계획을 잡으세요.</p>';
  else out += `<p class="tip">${peak}주 차쯤 손님이 가장 많아요. 그 직후가 추가 홍보를 하기 좋은 때예요.</p>`;
  return out;
}

    <p style="margin-top:12px"><b>${esc(promoText(x.promo) || '-')}</b> (${Object.entries(bp.timing || {}).map(([c, t]) => `${esc(nm(c))} ${esc(t)}`).join(', ')})</p>
    <p>12주 동안 손님이 약 ${fmt(bp.visitors_gain)}명 늘고, 만 원당 ${bp.per_10k}명, 광고비의 ${bp.roas}배 매출이에요. ${bp.payback_week ? bp.payback_week + '주 차에 광고비를 돌려받아요.' : '12주 안에는 광고비를 다 돌려받지 못해요.'}</p>
    <p>손익분기: ${bp.breakeven_without ? bp.breakeven_without + '주 차' : '12주 안 없음'} → ${bp.breakeven_with ? bp.breakeven_with + '주 차' : '12주 안 없음'}</p>
    <h3>채널별로 예산 전부를 썼을 때</h3>
    ${table(['채널', '추천 시점', '오픈 전', '오픈 주', '정체기', '12주 증가', '만 원당', '매출 배수'],
      sc.map(s => [esc(nm(s.name)), esc(s.timing), ...(s.by_timing ? ['오픈전', '오픈주', '정체기'].map(t => fmt(s.by_timing[t])) : ['-', '-', '-']),
        fmt(s.visitors_gain) + '명', s.per_10k ?? '-', s.roas ?? '-']), [2, 3, 4, 5, 6, 7])}`;
  if (bp.robust) out += `<h3>믿을 만한가요</h3><p>광고 단가가 최소~최대 범위에서 바뀌어도 1순위(${esc(nm(bp.robust.top_channel))})가 그대로인 경우가 ${Math.round(bp.robust.same_top_share * 100)}%예요. ${bp.robust.stable ? '단가가 달라져도 추천이 거의 그대로예요.' : '단가에 따라 추천이 달라질 수 있어서, 실제 견적을 받아보고 다시 계산하는 게 좋아요.'}</p>`;
  if (hv.reach_hub) out += `<h3>입소문 대장 쿠폰 vs 넓게 알리기</h3><p>같은 ${fmt(Math.round(hv.budget / 10000))}만 원이면 인스타로 넓게 알릴 때 약 ${fmt(hv.broad_gain)}명, 입소문 대장에게 쿠폰을 줄 때 약 ${fmt(hv.hub_gain)}명이 더 와요. 입소문 대장 1명은 평균 ${hv.reach_hub}명에게 전하지만 쿠폰 비용이 더 들어요.</p>`;
  out += `<p class="muted" style="margin-top:24px">${esc(bp.assumption_note || '')}</p>`;
  return out;
}

function detailFix(x, d) {
  let out = `<span class="label"><span class="dot" style="background:#111"></span>Fix</span><h2 id="detail-title">무엇을 바꾸면 좋을까</h2>`;
  if (x.revision) out += `<h3>고친 아이디어</h3><p><b>${esc(x.revision)}</b></p>${d.revision_changes.length ? '<ul>' + d.revision_changes.map(c => `<li>${esc(c)}</li>`).join('') + '</ul>' : ''}`;
  if (d.prescriptions.length) out += `<h3>소식이 덜 닿은 집단</h3>${table(['집단', '인지율', '전체', '안 가는 이유', '추천 채널', '제안'],
    d.prescriptions.map(p => [g(p.group), pct(p.awareness), pct(p.overall_awareness), esc(p.reason_type), esc(p.channel), esc(p.offer)]), [1, 2])}`;
  if (d.diagnosis) {
    const parts = d.diagnosis.split(/\[([^\]]+)\]/).filter(t => t.trim());
    let html = '';
    for (let i = 0; i < parts.length; i++) {
      if (i + 1 < parts.length && parts[i].length < 20) { html += `<h3>${esc(parts[i])}</h3><p>${esc(parts[i + 1].trim()).replace(/\n+/g, '<br>')}</p>`; i++; }
      else html += `<p>${esc(parts[i].trim()).replace(/\n+/g, '<br>')}</p>`;
    }
    out += html;
  }
  if (!d.prescriptions.length) {
    const ac = awarenessCheck(d);
    if (ac) {
      const ratio = ac.avg ? ac.low[1] / ac.avg : 1;
      out += `<h3>막힌 집단이 없는 근거</h3>
        <p>집단별로 소식이 닿은 비율을 평균(${pct(ac.avg)})과 비교했어요. 가장 낮은 <b>${g(ac.low[0])}</b>도 ${pct(ac.low[1])}로 평균의 ${Math.round(ratio * 100)}%까지 닿아서, 특정 집단만 소식에서 빠지는 문제는 보이지 않아요.</p>
        ${table(['집단', '소식이 닿은 비율', '평균과 차이', '인원'], ac.rows.map(([g0, v]) => [g(g0), pct(v), ((v - ac.avg) * 100 >= 0 ? '+' : '') + ((v - ac.avg) * 100).toFixed(0) + '%p', (d.group_count || {})[g0] ? fmt(d.group_count[g0]) + '명' : '-']), [1, 2, 3])}
        <p class="muted" style="font-size:13px;margin-top:8px">반경 안 인원이 20명 미만인 집단은 비율이 크게 튀어서 비교에서 뺐어요.</p>`;
    } else if (!x.revision && !d.diagnosis) out += '<p style="margin-top:12px">특별히 막힌 집단이 없어요.</p>';
  }
  return out;
}

function detailChannel(x, d) {
  const cs = d.channel_share || {}, ga = d.group_awareness || {};
  const rows = Object.entries(cs).map(([grp, m]) => {
    const top = Object.entries(m).sort((a, b) => b[1] - a[1]);
    return [g(grp), top[0] ? `${esc(CH[top[0][0]] || top[0][0])} ${pct(top[0][1])}` : '-', top[1] ? `${esc(CH[top[1][0]] || top[1][0])} ${pct(top[1][1])}` : '-', pct(ga[grp])];
  });
  const low = Object.entries(ga).sort((a, b) => a[1] - b[1]).slice(0, 3);
  let out = `<span class="label"><span class="dot"></span>Channel</span><h2 id="detail-title">누가 어떤 경로로 알게 되나</h2>
    <p style="margin-top:12px">동네 이웃은 이웃끼리의 입소문, 지나가다는 가게 앞을 지나다 발견한 경우, 검색은 후기가 쌓여 검색으로 찾은 경우예요. 당근·인스타·맘카페·에타는 그 커뮤니티 안에서 전해진 경우예요.</p>
    <h3>집단별 1·2순위 경로</h3>${table(['집단', '1순위', '2순위', '인지율'], rows, [3])}`;
  const ct = x.channels || {};
  const topCh = Object.entries(ct).sort((a, b) => b[1] - a[1]).filter(([k]) => PLAYBOOK[k]).slice(0, 3);
  if (topCh.length) {
    out += '<h3>경로별로 이렇게 따라 해보세요</h3><p class="muted" style="font-size:14px">이 동네에서 손님이 많이 알게 되는 경로 순서예요. 동네 가게들이 일반적으로 많이 쓰는 방법을 모았어요.</p><div class="playbook">';
    for (const [k, v] of topCh) out += `<div class="play-card"><div class="play-head"><b>${esc(CH[k] || k)}</b><span>${pct(v)}</span></div><ol>${PLAYBOOK[k].map(t => `<li>${esc(t)}</li>`).join('')}</ol></div>`;
    out += '</div>';
  }
  if (low.length) {
    out += '<h3>이렇게 해보세요</h3>';
    for (const [grp, v] of low) {
      const top = Object.entries(cs[grp] || {}).sort((a, b) => b[1] - a[1])[0];
      out += `<p class="tip"><b>${g(grp)}</b>은 소식이 ${pct(v)}에게만 닿았어요.${top ? ` 이 집단은 주로 <b>${esc(CH[top[0]] || top[0])}</b>로 알게 되니, 이 경로로 알리는 게 효과적이에요.` : ''}</p>`;
    }
  }
  return out;
}

function detailHub(x, d) {
  const hubs = d.hubs || [], hv = d.hub_vs_broad || {};
  const count = {};
  hubs.forEach(h => (h.community || []).forEach(c => count[c] = (count[c] || 0) + 1));
  const topComm = Object.entries(count).sort((a, b) => b[1] - a[1])[0];
  const topGroup = Object.entries(hubs.reduce((m, h) => (m[h.group] = (m[h.group] || 0) + 1, m), {})).sort((a, b) => b[1] - a[1])[0];
  let out = `<span class="label"><span class="dot" style="background:#111"></span>Word of mouth</span><h2 id="detail-title">소문을 가장 많이 내 준 사람들</h2>
    <p style="margin-top:12px">입소문 대장 1명은 평균 ${hv.reach_hub ?? '-'}명에게 소식을 전했어요. 보통 사람(${hv.reach_broad ?? '-'}명)의 ${hv.per_person_ratio ?? '-'}배예요.</p>
    <h3>입소문 대장 ${hubs.length}명</h3>${table(['집단', '사는 동', '직접 전함', '거쳐서 전해진 인원', '처음 들은 주', '쓰는 커뮤니티'],
      hubs.map(h => [g(h.group), esc(h.dong), fmt(h.direct) + '명', fmt(h.reach) + '명', (h.week + 1) + '주 차', esc((h.community || []).join(', ') || '-')]), [2, 3])}
    <h3>이렇게 해보세요</h3>`;
  if (topGroup) out += `<p class="tip">입소문 대장 중엔 <b>${g(topGroup[0])}</b>이 가장 많아요. 오픈 첫 주에 이 집단에게 시식이나 첫 방문 쿠폰을 주면 소문이 빨리 퍼져요.</p>`;
  if (topComm) out += `<p class="tip">입소문 대장들이 가장 많이 쓰는 커뮤니티는 <b>${esc(topComm[0])}</b>예요. 이 커뮤니티에 첫 후기가 올라오게 하는 게 좋아요.</p>`;

  const last = all[all.length - 1], r = Number(last.rank_corr), v = verdict(r);
  let out = `<span class="label"><span class="dot" style="background:#111"></span>Validation</span>
    <h2 id="detail-title">${v.short}</h2>
    <p style="margin-top:12px">서울 ${esc(String(last.target || '').match(/\d+/) ? String(last.target).match(/\d+/)[0] + '개 동' : '여러 동네')}에서, 이 서비스가 매긴 동네 순위를 실제 카페 매출 순위와 비교했어요. ${v.long}</p>
    ${gauge(r)}
    <p class="tip"><b>이렇게 쓰세요.</b> 동네끼리 어디가 더 나은지 <b>비교하는 용도</b>로 보시고, 손님 수는 정확한 값보다 대략적인 크기로 봐주세요.</p>
    <h3>알아두면 좋은 점</h3><ul>`;
  if (all.length > 1) out += `<li>처음 검증에서는 ${Number(all[0].rank_corr).toFixed(2)}로 순위가 거꾸로였는데, 유동인구·직장인구를 반영한 뒤 ${r.toFixed(2)}로 좋아졌어요.</li>`;
  if (last.group_a_corr != null && last.group_b_corr != null)
    out += Math.abs(last.group_a_corr - last.group_b_corr) > 0.1
      ? '<li>동네를 반으로 나눠 따로 확인했더니 <b>지역에 따라 정확도가 달라요.</b> 어떤 지역에선 잘 맞고 어떤 지역에선 덜 맞아요.</li>'
      : '<li>동네를 반으로 나눠 따로 확인해도 비슷하게 맞아서, 특정 동네에만 맞춘 결과는 아니에요.</li>';
  if (last.channel_gap_pp) {
    const [k, gap] = Object.entries(last.channel_gap_pp).sort((a2, b2) => Math.abs(b2[1]) - Math.abs(a2[1]))[0];
    const name = { '지나가다': '가게 앞을 지나다 들어오는 손님', '네이버검색': '검색해서 찾아오는 손님', '인스타': '인스타로 알게 된 손님', '당근커뮤니티': '당근으로 알게 된 손님' }[k] || k;
    out += `<li>설문과 비교하면 <b>${esc(name)}을 실제보다 ${gap < 0 ? '적게' : '많게'}</b> 잡는 편이에요 (${Math.abs(gap).toFixed(0)}%p 차이). 실제로는 이 경로 손님이 조금 더 많을 수 있어요.</li>`;
  }
  const sv = last.survival_validation;
  if (sv && typeof sv === 'object') out += `<li>손익분기를 넘긴 동네가 실제로 가게가 더 오래 살아남는 경향은 보였어요 (생존율 ${sv.mean_survival_bep_achieved_pct}% vs ${sv.mean_survival_bep_null_pct}%). 다만 비교한 동이 ${sv.matched_dongs}곳뿐이라 확실하다고 하긴 어려워요.</li>`;
  out += '</ul>';
  out += `<details style="margin-top:28px"><summary style="cursor:pointer;font-weight:700">자세한 수치 보기</summary>
    ${table(['회차', '대상', '순위 상관', '절반 A', '절반 B'], all.map(v2 => [v2.round ?? '-', esc(v2.target || '-'), v2.rank_corr ?? '-', v2.group_a_corr ?? '-', v2.group_b_corr ?? '-']), [2, 3, 4])}
    ${last.channel_gap_pp ? table(['경로', '시뮬레이션 − 설문'], Object.entries(last.channel_gap_pp).map(([k, v2]) => [esc(k), (v2 > 0 ? '+' : '') + Number(v2).toFixed(1) + '%p']), [1]) : ''}
    ${sv && typeof sv === 'object' ? `<p style="margin-top:12px">${esc(sv.interpretation || '')}</p>` : ''}
    ${last.next ? `<p class="muted">다음 검증: ${esc(last.next)}</p>` : ''}</details>`;
  return out;
}

let lastBox = null;
function openDetail(key, box, x) {
  const d = x.detail || {};
  const body = { curve: detailCurve, promo: detailPromo, fix: detailFix, channel: detailChannel, hub: detailHub, validation: detailValidation }[key];
  if (!body) return;
  const panel = document.getElementById('detail');
  panel.innerHTML = `<button class="close" aria-label="닫기">✕</button><div class="detail-yolk" aria-hidden="true"></div>${body(x, d)}`;
  panel.hidden = false;
  const dim = document.getElementById('dim');
  dim.hidden = false;
  panel.style.top = box.offsetTop + 'px';
  panel.scrollTop = 0;
  lastBox = box;
  const close = () => { panel.hidden = true; dim.hidden = true; if (lastBox) lastBox.focus(); };
  dim.onclick = close;
  panel.querySelector('.close').addEventListener('click', e => { e.stopPropagation(); close(); });
  panel.onkeydown = e => { if (e.key === 'Escape') close(); };
  panel.querySelector('.close').focus();
}

function drawMap(x, week) {
  if (timer) { clearInterval(timer); timer = null; }
  if (map) { map.remove(); map = null; }
  if (typeof L === 'undefined') { document.getElementById('map').textContent = '지도를 불러오지 못했어요.'; return; }
  map = L.map('map', { zoomControl: true, scrollWheelZoom: false, preferCanvas: true }).setView(x.center, 15);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19 }).addTo(map);
  L.circleMarker(x.center, { radius: 12, color: '#111', weight: 6, fillColor: '#F5B301', fillOpacity: 1 })
    .addTo(map).bindTooltip('내 가게', { permanent: true, direction: 'bottom', offset: [0, 10] });
  layer = L.layerGroup().addTo(map);
  const slider = document.getElementById('week');
  const show = w => {
    layer.clearLayers();
    let cnt = 0;
    for (const [lat, lng, hw] of x.dots) {
      const heard = hw >= 0 && hw < w;
      if (!heard) continue;            // 아직 모르는 사람은 그리지 않음 (화면이 빽빽해지지 않게)
      cnt++;
      const now = hw === w - 1;        // 이번 주에 새로 들은 사람만 크고 진하게
      L.circleMarker([lat, lng], now
        ? { radius: 7, color: '#FFFFFF', weight: 2, fillColor: '#D98200', fillOpacity: 1 }
        : { radius: 4, color: '#9A6400', weight: 1, opacity: 0.9, fillColor: '#F5B301', fillOpacity: 0.9 }).addTo(layer);
    }
    document.getElementById('wk').textContent = w;
    document.getElementById('wk2').textContent = w;
    document.getElementById('cnt').textContent = fmt(cnt);
  };
  show(week);
  slider.addEventListener('input', () => show(Number(slider.value)));
  const play = document.getElementById('play');
  play.addEventListener('click', () => {
    if (timer) { clearInterval(timer); timer = null; play.textContent = '▶'; play.setAttribute('aria-label', '재생'); return; }
    let w = Number(slider.value) >= x.weekly.length ? 1 : Number(slider.value);
    play.textContent = '❚❚'; play.setAttribute('aria-label', '정지');
    timer = setInterval(() => {
      slider.value = w; show(w); w++;
      if (w > x.weekly.length) { clearInterval(timer); timer = null; play.textContent = '▶'; play.setAttribute('aria-label', '재생'); }
    }, 700);
  });
}

if (DATA.view === 'hero') renderHero();
else if (DATA.view === 'how') renderHow();
else if (!DATA.dongs.length) app.innerHTML = '<p>결과가 없어요.</p>';
else if (DATA.view === 'result') renderResult(DATA.dongs[0].code);
else renderHome();
</script>
